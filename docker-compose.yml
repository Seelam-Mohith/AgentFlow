services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      MAX_CRAWL_PAGES: ${MAX_CRAWL_PAGES:-5}
      CRAWL_TIMEOUT_SECONDS: ${CRAWL_TIMEOUT_SECONDS:-60}
    volumes:
      - agentflow-data:/data
    init: true
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
volumes:
  agentflow-data:
